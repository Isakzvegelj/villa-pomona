<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d6b4e"/>
      <stop offset="100%" stop-color="#1a3a2a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4a853"/>
      <stop offset="100%" stop-color="#b8943e"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect x="0" y="0" width="512" height="512" rx="96" ry="96" fill="url(#bg)"/>
  <!-- Leaf motif -->
  <path d="M256 100 C200 140, 150 200, 150 270 C150 340, 195 390, 256 390 C317 390, 362 340, 362 270 C362 200, 312 140, 256 100Z" fill="none" stroke="url(#gold)" stroke-width="6" opacity="0.3"/>
  <!-- Villa roof silhouette -->
  <path d="M120 310 L256 210 L392 310" fill="none" stroke="url(#gold)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Villa walls -->
  <rect x="160" y="310" width="192" height="100" rx="4" fill="none" stroke="url(#gold)" stroke-width="6"/>
  <!-- Door -->
  <rect x="230" y="350" width="52" height="60" rx="3" fill="url(#gold)" opacity="0.8"/>
  <!-- Windows -->
  <rect x="175" y="330" width="36" height="30" rx="2" fill="none" stroke="url(#gold)" stroke-width="4"/>
  <rect x="301" y="330" width="36" height="30" rx="2" fill="none" stroke="url(#gold)" stroke-width="4"/>
  <!-- Leaf accent above roof -->
  <path d="M256 185 C240 195, 228 210, 228 230 C228 250, 240 260, 256 260 C272 260, 284 250, 284 230 C284 210, 272 195, 256 185Z" fill="url(#gold)" opacity="0.15"/>
  <path d="M256 195 L256 255" stroke="url(#gold)" stroke-width="2" opacity="0.4"/>
  <path d="M256 210 L242 222" stroke="url(#gold)" stroke-width="2" opacity="0.3"/>
  <path d="M256 225 L270 237" stroke="url(#gold)" stroke-width="2" opacity="0.3"/>
  <!-- P text -->
  <text x="256" y="480" font-family="Georgia, serif" font-size="48" fill="url(#gold)" text-anchor="middle" font-weight="400" letter-spacing="6">POMONA</text>
</svg>
